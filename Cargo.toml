[package]
name = "invoicelift-contract"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[workspace]
resolver = "2"
members = [
    "governance",
    "invoice-registry",
    "pool-manager",
    "repayment-waterfall",
]

# Values every crate in the workspace inherits with `<field>.workspace = true`.
# Bumping the edition or the MSRV is a single edit here rather than one per
# crate, which is what stops the four contracts drifting apart.
[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.78"

# Single source of truth for dependency versions. Crates opt in with
# `<dep>.workspace = true` and may still add their own `features` on top; a
# version bump here reaches every crate at once, and it is no longer possible
# for two contracts to compile against different soroban-sdk builds.
[workspace.dependencies]
soroban-sdk = { version = "20.5.0" }
# Test-side only: generates real Ed25519 keypairs and signatures for the
# multisig-verification suite. `env.crypto().ed25519_verify` itself needs no
# extra dependency at runtime.
ed25519-dalek = { version = "2.0.0" }
rand = "0.8"
# Intra-workspace path dependencies, so a crate that gains a sibling dependency
# does not have to restate the relative path.
invoice-registry = { path = "invoice-registry" }
pool-manager = { path = "pool-manager" }
repayment-waterfall = { path = "repayment-waterfall" }

[patch.crates-io]
ethnum = { path = "ethnum-1.5.0" }

[dev-dependencies]
# Property-based tests for the financial arithmetic (issue #9). Pinned minor
# so a proptest release cannot change the generated cases and turn CI red on
# a run that touched no contract code.
proptest = "1.5"
soroban-sdk = { workspace = true, features = ["testutils"] }
invoice-registry = { workspace = true, features = ["testutils"] }
pool-manager = { workspace = true, features = ["testutils"] }
repayment-waterfall = { workspace = true, features = ["testutils"] }

# Release profile for the deployable Wasm artifacts.
#
# Without these, the contracts build with the default `release` profile, which
# optimises for speed and keeps symbols — pool_manager was 65,502 bytes against
# the CI's 65,536-byte ceiling, i.e. 34 bytes of headroom, so any change at all
# broke the size check. `opt-level = "z"` plus LTO, a single codegen unit and
# stripped symbols is the standard Soroban contract profile.
#
# `overflow-checks` stays on deliberately: silent wrapping in financial
# arithmetic is worth far more than the bytes it costs.
[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
