[package]
name = "invoice-registry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
# Only used in tests, to generate real Ed25519 keypairs/signatures for the
# multisig-verification test suite (env.crypto().ed25519_verify itself needs
# no extra dependency at runtime - this is purely a test-side signer). The
# version lives in [workspace.dependencies]; the feature is local to this use.
ed25519-dalek = { workspace = true, features = ["rand_core"] }
rand.workspace = true

[features]
testutils = ["soroban-sdk/testutils"]
